name: C++ Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror main.cpp -o quicksort

      - name: Smoke test
        run: |
          output=$(printf '9\n8 4 7 3 9 2 6 5 1\n' | ./quicksort)
          echo "$output"
          echo "$output" | grep -F "Sorted array: 1 2 3 4 5 6 7 8 9"
